<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSJR QR — Create. Customize. Connect.</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-mark">M</span>
        <div class="logo-text">
          <h1>MSJR <span>QR</span></h1>
          <p>Create. Customize. Connect.</p>
        </div>
      </div>
      <button id="historyToggle" class="btn-icon" aria-label="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </button>
    </header>

    <main class="main">
      <!-- Left: Form -->
      <section class="panel form-panel">
        <div class="tabs" id="typeTabs">
          <button class="tab active" data-type="url">URL</button>
          <button class="tab" data-type="text">Text</button>
          <button class="tab" data-type="wifi">Wi‑Fi</button>
          <button class="tab" data-type="email">Email</button>
          <button class="tab" data-type="phone">Phone</button>
          <button class="tab" data-type="sms">SMS</button>
          <button class="tab" data-type="vcard">vCard</button>
          <button class="tab" data-type="whatsapp">WhatsApp</button>
        </div>

        <form id="qrForm" class="form" novalidate>
          <!-- URL -->
          <div class="form-group" data-type="url">
            <label for="urlInput">Website URL</label>
            <input type="url" id="urlInput" placeholder="https://example.com" />
            <small class="error" id="urlError"></small>
          </div>

          <!-- Text -->
          <div class="form-group hidden" data-type="text">
            <label for="textInput">Plain Text</label>
            <textarea id="textInput" rows="4" placeholder="Enter any text..."></textarea>
            <small class="error" id="textError"></small>
          </div>

          <!-- Wi-Fi -->
          <div class="form-group hidden" data-type="wifi">
            <label for="wifiSsid">Network Name (SSID)</label>
            <input type="text" id="wifiSsid" placeholder="MyWiFi" />
            <label for="wifiPass">Password</label>
            <input type="text" id="wifiPass" placeholder="password" />
            <label for="wifiEnc">Encryption</label>
            <select id="wifiEnc">
              <option value="WPA">WPA/WPA2</option>
              <option value="WEP">WEP</option>
              <option value="nopass">None</option>
            </select>
            <small class="error" id="wifiError"></small>
          </div>

          <!-- Email -->
          <div class="form-group hidden" data-type="email">
            <label for="emailTo">Recipient Email</label>
            <input type="email" id="emailTo" placeholder="hello@example.com" />
            <label for="emailSubject">Subject (optional)</label>
            <input type="text" id="emailSubject" placeholder="Subject" />
            <label for="emailBody">Body (optional)</label>
            <textarea id="emailBody" rows="2" placeholder="Message..."></textarea>
            <small class="error" id="emailError"></small>
          </div>

          <!-- Phone -->
          <div class="form-group hidden" data-type="phone">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" placeholder="+1234567890" />
            <small class="error" id="phoneError"></small>
          </div>

          <!-- SMS -->
          <div class="form-group hidden" data-type="sms">
            <label for="smsNumber">Phone Number</label>
            <input type="tel" id="smsNumber" placeholder="+1234567890" />
            <label for="smsMessage">Message</label>
            <textarea id="smsMessage" rows="2" placeholder="Hello..."></textarea>
            <small class="error" id="smsError"></small>
          </div>

          <!-- vCard -->
          <div class="form-group hidden" data-type="vcard">
            <label for="vcFirstName">First Name</label>
            <input type="text" id="vcFirstName" placeholder="John" />
            <label for="vcLastName">Last Name</label>
            <input type="text" id="vcLastName" placeholder="Doe" />
            <label for="vcPhone">Phone</label>
            <input type="tel" id="vcPhone" placeholder="+1234567890" />
            <label for="vcEmail">Email</label>
            <input type="email" id="vcEmail" placeholder="john@example.com" />
            <label for="vcOrg">Organization</label>
            <input type="text" id="vcOrg" placeholder="Company" />
            <small class="error" id="vcardError"></small>
          </div>

          <!-- WhatsApp -->
          <div class="form-group hidden" data-type="whatsapp">
            <label for="waNumber">Phone Number (with country code)</label>
            <input type="tel" id="waNumber" placeholder="+1234567890" />
            <label for="waMessage">Message (optional)</label>
            <textarea id="waMessage" rows="2" placeholder="Hello!"></textarea>
            <small class="error" id="whatsappError"></small>
          </div>

          <!-- Customization -->
          <div class="customize-section">
            <h3>Customize</h3>
            <div class="row">
              <div class="col">
                <label>Foreground</label>
                <input type="color" id="fgColor" value="#f0211a" />
              </div>
              <div class="col">
                <label>Background</label>
                <input type="color" id="bgColor" value="#0b0b0f" />
              </div>
              <div class="col">
                <label>Transparent BG</label>
                <input type="checkbox" id="transparentBg" />
              </div>
            </div>
            <div class="row">
              <div class="col">
                <label>Dot Style</label>
                <select id="dotStyle">
                  <option value="square">Square</option>
                  <option value="rounded" selected>Rounded</option>
                  <option value="dots">Dots</option>
                  <option value="classy">Classy</option>
                  <option value="classy-rounded">Classy Rounded</option>
                  <option value="extra-rounded">Extra Rounded</option>
                </select>
              </div>
              <div class="col">
                <label>Corner Style</label>
                <select id="cornerStyle">
                  <option value="square">Square</option>
                  <option value="dot" selected>Dot</option>
                  <option value="extra-rounded">Extra Rounded</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <label>Error Correction</label>
                <select id="errorLevel">
                  <option value="L">L (7%)</option>
                  <option value="M">M (15%)</option>
                  <option value="Q" selected>Q (25%)</option>
                  <option value="H">H (30%)</option>
                </select>
              </div>
              <div class="col">
                <label>Logo Size</label>
                <input type="range" id="logoSize" min="0.2" max="0.5" step="0.05" value="0.4" />
              </div>
            </div>
            <div class="row">
              <div class="col full">
                <label for="logoUpload">Upload Logo (PNG/SVG)</label>
                <input type="file" id="logoUpload" accept="image/*" />
                <button type="button" id="removeLogo" class="btn-text hidden">Remove Logo</button>
              </div>
            </div>
          </div>

          <!-- Export -->
          <div class="export-section">
            <h3>Export</h3>
            <div class="row">
              <div class="col">
                <label>Output Size</label>
                <select id="exportSize">
                  <option value="300">300 × 300</option>
                  <option value="600" selected>600 × 600</option>
                  <option value="1000">1000 × 1000</option>
                  <option value="2000">2000 × 2000</option>
                </select>
              </div>
            </div>
            <div class="row">
              <button type="button" id="downloadPng" class="btn-primary">Download PNG</button>
              <button type="button" id="downloadSvg" class="btn-secondary">Download SVG</button>
            </div>
          </div>
        </form>
      </section>

      <!-- Right: Preview -->
      <section class="panel preview-panel">
        <div class="preview-wrapper">
          <div id="qrPreview" class="qr-preview"></div>
          <div id="previewEmpty" class="preview-empty">
            <p>Enter data to generate a QR code</p>
          </div>
        </div>
        <div class="preview-actions">
          <button id="copyContent" class="btn-text" disabled>Copy Content</button>
          <span id="previewStatus" class="status"></span>
        </div>
      </section>
    </main>

    <!-- History Drawer -->
    <aside id="historyDrawer" class="history-drawer">
      <div class="history-header">
        <h2>History</h2>
        <button id="historyClose" class="btn-icon" aria-label="Close">✕</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <button id="clearHistory" class="btn-danger hidden">Clear All</button>
    </aside>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
  <script src="js/history.js"></script>
  <script src="js/qr-generator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
